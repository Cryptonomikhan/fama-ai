version: '3.8'

services:
  api:
    image: cryptonimkhan/fama-api:0.1.0
    container_name: fama-api
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Optional local development database
  # The API doesn't require this since storage configuration
  # comes from API callers in their requests
  postgres:
    image: ankane/pgvector:latest
    container_name: fama-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-fama_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-fama}
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD:-md5}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - fama-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fama_user} -d ${POSTGRES_DB:-fama}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - dev  # Only start with docker-compose --profile dev up
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres-data:
    driver: local

networks:
  fama-network:
    driver: bridge
    name: fama-network
